<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Header Verify</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; background: #fff; font-family: Arial, sans-serif; }
    #result {
      /* Single short word (PASS / FAIL): responsive, never clips or overflows, always large enough
         for OCR. clamp = floor / fluid / cap. Same pattern as accessibility_check.ejs so BSA's
         existing ocrCanvasWord(['pass','fail']) reads it with zero new OCR code. */
      font-size: clamp(40px, 16vw, 96px);
      line-height: 1.1;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #000;
      text-align: center;
      max-width: 90vw;
      box-sizing: border-box;
      overflow-wrap: break-word;
      padding: clamp(12px, 4vw, 32px) clamp(16px, 6vw, 48px);
    }
    /* Fail detail: shown UNDER the word only on FAIL (for humans / screenshots), small so it
       never competes with the OCR word. Hidden on PASS + on CHECKING. The test OCRs #result,
       not this. */
    #detail { display: none; margin-top: 18px; max-width: 92vw; font-size: clamp(12px, 3vw, 18px); color: #b00; text-align: center; overflow-wrap: anywhere; white-space: pre-wrap; }
    body.fail #detail { display: block; }
    body.fail { flex-direction: column; }
  </style>
</head>
<body>
  <!--
    Self-contained header-injection verify page. Replaces the old two-hop check_header.ejs +
    /paste -> /pasted_text flow (which raced: the device POSTed captured headers to /paste, the
    test fetched /pasted_text separately, and that write/read window flapped). Here the page does
    the whole verify IN-PAGE and renders ONE OCR-able state word (PASS / FAIL), the same pattern
    as accessibility_check.ejs / dark_mode. The test screenshots + OCRs the word after each toggle
    with ocrCanvasWord(['pass','fail']). No second endpoint, no paste round-trip.

    URL model — arbitrary header pairs, ALL must match for PASS:
      /header_verify.html?X-Custom-Header=MyHeaderValue&Authorization=null&echo=self
        * each NON-reserved query pair is a header expectation:
            key   = header name (case-insensitive)
            value = expected value (case-insensitive); the literal  null  means "expect ABSENT"
        * verdict = PASS iff EVERY pair is satisfied (present-ones found w/ matching value,
          null-ones absent); otherwise FAIL. Per-key results go to #detail + console for fail-only
          diagnosis, never OCR'd.
        * the caller builds the pair list per platform, e.g. android run passes
          ?X-Custom-Header=MyHeaderValue ; the same scenario on iOS (disable case) passes
          ?X-Custom-Header=null . The page holds no platform logic.

    Reserved (NOT treated as header pairs):
      &echo=self|server|httpbin  data source:
                                   self    = SYNTHETIC (no network): build the echoed header map
                                             from the pairs themselves (present -> injected,
                                             null -> omitted). Deterministic proof of verdict logic
                                             + OCR render, zero external dep / CORS. GH-pages proof.
                                   server  = fetch <live_server>/check_custom_header_data, whose
                                             headers reflect the SESSION's proxy-injected egress
                                             (real in-session path). Same-origin when this page is
                                             served from the live_server, else pass &live_server=.
                                   httpbin = real network echo via httpbin.org/headers (CORS *):
                                             page sets the present-pairs on its own fetch. Optional
                                             true-network sanity check (httpbin is sometimes 503).
      &live_server=<url>         live_server base for echo=server (required unless same-origin).
      &cb=<x>                    cache-buster, ignored.
  -->
  <div id="result">CHECKING</div>
  <div id="detail"></div>
  <script>
    var RESERVED = { echo: 1, live_server: 1, cb: 1 };
    var params    = new URLSearchParams(location.search);
    var echoMode  = (params.get("echo") || "self").toLowerCase();
    var liveServer = params.get("live_server") || "";

    // Build the expectation list from every non-reserved pair. value === "null" -> expect absent.
    var expects = [];
    params.forEach(function (val, rawKey) {
      if (RESERVED[rawKey.toLowerCase()]) return;
      var wantAbsent = String(val).toLowerCase() === "null";
      expects.push({ key: rawKey.toLowerCase(), value: wantAbsent ? null : String(val).toLowerCase(), wantAbsent: wantAbsent });
    });

    // Render the OCR word (PASS/FAIL/CHECKING). On FAIL, reveal the detail line underneath;
    // on PASS/CHECKING keep it hidden so nothing competes with the word for OCR.
    function render(word, detailText) {
      document.getElementById("result").innerText = word;
      var d = document.getElementById("detail");
      d.innerText = detailText || "";
      document.body.classList.toggle("fail", word === "FAIL");
    }

    // Evaluate all expectations against an echoed header map. Returns {pass, detail[]}.
    function evaluate(headers) {
      var lower = {};
      Object.keys(headers || {}).forEach(function (k) { lower[k.toLowerCase()] = String(headers[k]).toLowerCase(); });
      var allPass = true;
      var detail = [];
      if (expects.length === 0) { allPass = false; detail.push("no header pairs given"); }
      expects.forEach(function (e) {
        var has = Object.prototype.hasOwnProperty.call(lower, e.key);
        var ok;
        if (e.wantAbsent) {
          ok = !has;                                   // disable case: PASS when header absent
        } else {
          ok = has && (e.value === "" || lower[e.key] === e.value);  // presence (+value if given)
        }
        if (!ok) allPass = false;
        detail.push(e.key + (e.wantAbsent ? "=ABSENT?" : "=" + e.value) + " -> " + (ok ? "OK" : "MISS(got " + (has ? lower[e.key] : "<none>") + ")"));
      });
      return { pass: allPass, detail: detail };
    }

    // --- data sources ---
    function fetchSelf() {
      // SYNTHETIC (no network): the echoed map = present-pairs injected, null-pairs omitted.
      var headers = {};
      expects.forEach(function (e) { if (!e.wantAbsent) headers[e.key] = e.value || "MyHeaderValue"; });
      return Promise.resolve(headers);
    }
    function fetchHttpbin() {
      var h = {};
      expects.forEach(function (e) { if (!e.wantAbsent) h[e.key] = e.value || "MyHeaderValue"; });
      return fetch("https://httpbin.org/headers?cb=" + Date.now(), { headers: h, cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) { return d.headers || {}; });
    }
    function fetchServer() {
      var base = /^https?:\/\//.test(liveServer) ? liveServer.replace(/\/+$/, "") : location.origin;
      return fetch(base + "/check_custom_header_data?cb=" + Date.now(), { mode: "cors", cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) { return d.headers || {}; });
    }
    function source() {
      if (echoMode === "server")  return fetchServer();
      if (echoMode === "httpbin") return fetchHttpbin();
      return fetchSelf();
    }

    function check() {
      source()
        .then(function (headers) {
          var v = evaluate(headers);
          render(v.pass ? "PASS" : "FAIL", v.pass ? "" : v.detail.join("\n"));
          if (!v.pass) console.log("[header_verify] FAIL:", v.detail.join(" | "));
        })
        .catch(function (e) {
          // Fetch error can't confirm any present-expectation -> FAIL. (A pure all-absent check
          // could arguably PASS on error, but a network error is a real signal worth surfacing.)
          console.error("[header_verify] fetch error:", e);
          render("FAIL", "fetch error: " + e.message);
        });
    }

    check();
    // Live re-check so a mid-session enable/disable toggle is reflected without re-navigation.
    setInterval(check, 3000);
  </script>
</body>
</html>
