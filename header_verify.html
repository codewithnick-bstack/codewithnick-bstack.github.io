<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Header Verify</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; background: #fff; font-family: Arial, sans-serif; }
    #result {
      /* Single short STATE word (PRESENT / ABSENT): responsive, never clips or overflows,
         always large enough for OCR. clamp = floor / fluid / cap. Same pattern as the other
         capability sentinel pages (dark_mode_check renders DARK/LIGHT, offline_check ONLINE/
         OFFLINE) so the test reads it with the existing verifyCapabilityWord(['present','absent']
         , expected) — screenshot -> centred crop -> OCR the word. */
      font-size: clamp(40px, 16vw, 96px);
      line-height: 1.1;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #000;
      text-align: center;
      max-width: 90vw;
      box-sizing: border-box;
      overflow-wrap: break-word;
      padding: clamp(12px, 4vw, 32px) clamp(16px, 6vw, 48px);
    }
    /* Diagnostic detail: shown for humans/screenshots on any non-PRESENT state (ABSENT/error) —
       NOT for OCR. Fixed + horizontally centred so it never shifts the centred state word, in a
       light red so the OCR crop (which reads the centred dark word) never picks it up. */
    #detail { display: none; position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); width: max-content; max-width: 94vw; max-height: 34vh; overflow: auto; font-family: monospace; font-size: clamp(10px, 1.8vw, 13px); line-height: 1.35; color: #f2b8b8; text-align: left; overflow-wrap: anywhere; white-space: pre-wrap; }
    body.show-detail #detail { display: block; }
  </style>
</head>
<body>
  <!--
    Self-contained custom-header-injection verify sentinel. Replaces the old two-hop flow
    (check_header.ejs -> POST /paste ; test fetches /pasted_text separately) which RACED: the
    write and the separate read flapped, giving "expected false to equal true" + "Failed to fetch
    pasted text after N attempts". Here the page checks the injected header IN-PAGE and renders
    the OBSERVED STATE as one OCR-able word — PRESENT or ABSENT — exactly like dark_mode_check
    (DARK/LIGHT) / offline_check (ONLINE/OFFLINE). No /paste, no /pasted_text, no second round-trip.

    LIVE RE-RENDER (the key property):
      The page is bookmark-launched ONCE and stays open for the whole session. It re-fetches the
      echo on a short interval, so when the header profile is toggled in the dock (enable/disable)
      the device's next egress request carries/drops the header, the next poll observes the change,
      and the word flips PRESENT <-> ABSENT WITH NO RE-NAVIGATION. The test just re-OCRs the same
      open page after each toggle:
        after ENABLE  -> word becomes PRESENT -> assert 'present'
        after DISABLE -> word becomes ABSENT  -> assert 'absent'
      Each fetch is cache-busted (?cb=) + no-store so a poll never reads a stale header set.

    URL:
      /header_verify?key=X-Custom-Header&value=MyHeaderValue
        key    = header name to observe (case-insensitive; default X-Custom-Header)
        value  = expected value (case-insensitive). If given, PRESENT requires the value to match;
                 a key present with a DIFFERENT value reads ABSENT (wrong header != injected).
                 Omit value to check presence of the key alone.

    Reserved (not header params): echo, live_server, session_id, cb.
      &echo=server|self|httpbin  data source (default server):
        server  = same-origin GET /check_custom_header_data ; its request carries the SESSION's
                  proxy-injected headers, and the route echoes them back. Real in-session path
                  (no CORS — same origin as this page on the live_server).
        self    = SYNTHETIC (no network): echo the key=value from the URL. Deterministic PRESENT
                  for offline OCR-render dev (can't exercise a live toggle).
        httpbin = real network echo via httpbin.org/headers (CORS *): page sets the header on its
                  own fetch. Optional sanity check (httpbin is sometimes 503).
      &live_server=<url>  override base for echo=server (else same-origin).
  -->
  <div id="result">CHECKING</div>
  <div id="detail"></div>
  <script>
    var params     = new URLSearchParams(location.search);
    var echoMode   = (params.get("echo") || "server").toLowerCase();
    var liveServer = params.get("live_server") || "";
    var key        = (params.get("key")   || "X-Custom-Header").toLowerCase();
    var value      = params.get("value");                    // null if omitted => presence-only
    var wantValue  = value === null ? null : String(value).toLowerCase();

    // Render the observed STATE word + toggle the diagnostic (shown on anything but PRESENT).
    function render(word, detailText) {
      document.getElementById("result").innerText = word;
      document.getElementById("detail").innerText = detailText || "";
      document.body.classList.toggle("show-detail", word !== "PRESENT");
    }

    // Observe the header in the echoed map. PRESENT iff key exists (and value matches when given);
    // otherwise ABSENT. Returns {word, observedVal, has}.
    function observe(headers) {
      var lower = {};
      Object.keys(headers || {}).forEach(function (k) { lower[k.toLowerCase()] = String(headers[k]).toLowerCase(); });
      var has = Object.prototype.hasOwnProperty.call(lower, key);
      var present = has && (wantValue === null || lower[key] === wantValue);
      return { word: present ? "PRESENT" : "ABSENT", observedVal: has ? lower[key] : null, observed: lower };
    }

    // Human-readable diagnostic (light-red, centred, OCR-safe): the state, the source, what was
    // expected vs observed for the key, and the FULL observed header map — so an ABSENT/error run
    // needs no log-diving to see what the echo actually returned.
    function buildReport(word, o, fetchErr) {
      var lines = [];
      lines.push("HEADER VERIFY: " + word);
      lines.push("source: echo=" + echoMode + (echoMode === "server" ? " (" + (liveServer || location.origin) + "/check_custom_header_data)" : ""));
      if (fetchErr) lines.push("fetch error: " + fetchErr);
      lines.push("checking: " + key + (wantValue === null ? " (presence only)" : " == \"" + wantValue + "\""));
      lines.push("observed:  " + key + " = " + (o && o.observedVal !== null && o.observedVal !== undefined ? "\"" + o.observedVal + "\"" : "<none>"));
      var obs = (o && o.observed) || {};
      var keys = Object.keys(obs);
      lines.push("all observed headers (" + keys.length + "):");
      if (keys.length === 0) {
        lines.push("  <none — echo returned no headers>");
      } else {
        keys.sort().forEach(function (k) { lines.push("  " + k + ": " + obs[k]); });
      }
      return lines.join("\n");
    }

    // --- data sources ---
    function fetchSelf() {
      // SYNTHETIC (no network): echo just this key=value. Deterministic PRESENT for offline dev.
      var headers = {};
      headers[key] = wantValue || "MyHeaderValue";
      return Promise.resolve(headers);
    }
    function fetchHttpbin() {
      var h = {};
      h[key] = wantValue || "MyHeaderValue";
      return fetch("https://httpbin.org/headers?cb=" + Date.now(), { headers: h, cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) { return d.headers || {}; });
    }
    function fetchServer() {
      var base = /^https?:\/\//.test(liveServer) ? liveServer.replace(/\/+$/, "") : location.origin;
      return fetch(base + "/check_custom_header_data?cb=" + Date.now(), { mode: "cors", cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) { return d.headers || {}; });
    }
    function source() {
      if (echoMode === "self")    return fetchSelf();
      if (echoMode === "httpbin") return fetchHttpbin();
      return fetchServer();
    }

    function check() {
      source()
        .then(function (headers) {
          var o = observe(headers);
          render(o.word, o.word === "PRESENT" ? "" : buildReport(o.word, o, null));
          if (o.word !== "PRESENT") console.log("[header_verify] ABSENT\n" + buildReport(o.word, o, null));
        })
        .catch(function (e) {
          // Could not obtain the echo — read ABSENT (header not observable) + dump the raw error.
          var o = observe({});
          var report = buildReport("ABSENT", o, (e && e.message) || String(e));
          render("ABSENT", report);
          console.error("[header_verify] fetch failed\n" + report, e);
        });
    }

    check();
    // LIVE re-check: the page is bookmark-launched once and stays open, so re-polling the echo is
    // what makes the word flip PRESENT<->ABSENT after a dock enable/disable toggle WITHOUT any
    // re-navigation. 1.5s keeps the post-toggle stale window short so the test's OCR reads fresh
    // state quickly. Each fetch is cache-busted + no-store (see source()), so a poll never reads a
    // stale header set.
    setInterval(check, 1500);
  </script>
</body>
</html>
